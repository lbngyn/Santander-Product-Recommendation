pipeline:
  version: lightgbm-acquisition-v3-persona-history
  description: >-
    24 independent LightGBM acquisition classifiers using canonical persona
    features at the current snapshot plus leakage-safe customer history,
    portfolio, frequency, recency and drop features from prior observations.

data:
  interim_train: interim/train.parquet
  model_panel: processed/lightgbm_v3/model_panel_persona_history.parquet
  artifact_dir: artifacts

split:
  validation_date: 2016-05-28

competition:
  raw_test: raw/test_ver2.csv
  interim_test: interim/test.parquet
  prepared_input: processed/lightgbm_v3/competition_test_input.parquet
  sample_submission: raw/sample_submission.csv
  generate_template_if_missing: true
  history_date: 2016-05-28
  chunksize: 50000
  force_rebuild: false
  show_progress: true
  top_k: 7

features:
  force_process: false
  preselect_training_samples: true

model:
  version: lightgbm-binary-v3-persona-history
  n_estimators: 20
  random_state: 42
  # Each model receives a deterministic, product-specific random negative set.
  negative_sampling_strategy: random
  training_log_period: 5
  lightgbm_params:
    device_type: cpu
    force_col_wise: false
    histogram_pool_size: 512
  max_rows_per_product: null
  max_negative_rows_per_product: 500000
  max_total_rows_per_product: 1000000

runtime:
  memory_limit: 4GB
  threads: 2
  temp_directory: data/.duckdb_tmp

tracking:
  mlflow:
    enabled: true
    tracking_uri: sqlite:///mlruns.db
    experiment_name: santander-lightgbm-acquisition-v3-persona-history
