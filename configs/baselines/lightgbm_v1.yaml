pipeline:
  version: lightgbm-acquisition-v1
  description: >-
    24 independent LightGBM binary acquisition classifiers. Customer profile
    values use month t; product ownership inputs use only t-1.

data:
  # Relative to SANTANDER_DATA_ROOT.
  interim_train: interim/train.parquet
  model_panel: processed/lightgbm_v1/model_panel.parquet
  artifact_dir: artifacts

features:
  force_process: false

model:
  version: lightgbm-binary-v1
  n_estimators: 300
  random_state: 42
  # Set a bound for constrained experiments; null uses every eligible row.
  max_rows_per_product: null

runtime:
  memory_limit: 2GB
  threads: 1
  temp_directory: data/.duckdb_tmp

tracking:
  mlflow:
    enabled: true
    tracking_uri: sqlite:///mlruns.db
    experiment_name: santander-lightgbm-acquisition

hydra:
  job:
    chdir: false
  run:
    dir: .hydra/runs/${now:%Y-%m-%d}/${now:%H-%M-%S}
